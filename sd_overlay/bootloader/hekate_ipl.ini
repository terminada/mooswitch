[config]
autoboot=1
autoboot_list=0
bootwait=3
noticker=0
verification=1
backlight=100
autohosoff=2
autonogc=1
updater2p=1
bootprotect=0

[CFW (cowMMC)]
pkg3=atmosphere/package3
kip1=atmosphere/kips/*
secmon=atmosphere/exosphere.bin
emummcforce=1
logopath=bootloader/bootlogo.bmp

[Semi-Stock (OFW)]
pkg3=atmosphere/package3
stock=1
emummc_force_disable=1

[Full Stock (OFW)]
ofw=1
