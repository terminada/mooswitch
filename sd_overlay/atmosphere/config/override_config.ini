[hbl_config]
; Album applet launches Sphaira directly; hold R while opening Album for stock Album gallery.
program_id_0=010000000000100D
override_key_0=!R

; Hold R while launching any game/title for full-RAM homebrew mode (Sphaira).
override_any_app=true
override_any_app_key=R
override_any_app_address_space=39_bit

[default_config]
override_key=!L
cheat_enable_key=!L
