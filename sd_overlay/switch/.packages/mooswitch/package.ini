;title='MooSwitch Tools'
;version=0.2.0
;creator=MooSwitch
;color=#00D4B4
;credits='Inspired by KEFIR (rashevskyv), StarterNX (lemon07r) & Ultrahand Packages (ppkantorski)'
;about='cowMMC guard toggles, theme quarantine, dot-clean/log cleanup, and safe reboot targets.'

[@cowMMC Guard]

[Allow SysMem Installs]
;mode=toggle
;toggle_state_condition=path_exists /atmosphere/flags/allow_user_content_install.flag
on:
    delete /atmosphere/flags/block_user_content_install.flag
    touch /atmosphere/flags/allow_user_content_install.flag
    notify-now 'SysMem installs enabled (reboot to apply)'
off:
    delete /atmosphere/flags/allow_user_content_install.flag
    touch /atmosphere/flags/block_user_content_install.flag
    notify-now 'SysMem installs blocked (reboot to apply)'

[Disable SD Save Redirect]
;mode=toggle
;toggle_state_condition=path_exists /atmosphere/flags/disable_save_redirect.flag
on:
    touch /atmosphere/flags/disable_save_redirect.flag
    notify-now 'SD save redirection disabled (reboot to apply)'
off:
    delete /atmosphere/flags/disable_save_redirect.flag
    notify-now 'SD save redirection enabled (reboot to apply)'

[@Maintenance]

[Quarantine Custom Themes]
mkdir /config/cowmmc/
mkdir /config/cowmmc/quarantined_themes/
move /atmosphere/contents/0100000000001000/ /config/cowmmc/quarantined_themes/0100000000001000/
move /atmosphere/contents/0100000000001007/ /config/cowmmc/quarantined_themes/0100000000001007/
move /atmosphere/contents/0100000000001013/ /config/cowmmc/quarantined_themes/0100000000001013/
move /atmosphere/contents/010000000000100B/ /config/cowmmc/quarantined_themes/010000000000100B/
move /atmosphere/contents/0100000000000811/ /config/cowmmc/quarantined_themes/0100000000000811/

[Restore Quarantined Themes]
mkdir /atmosphere/contents/
move /config/cowmmc/quarantined_themes/0100000000001000/ /atmosphere/contents/0100000000001000/
move /config/cowmmc/quarantined_themes/0100000000001007/ /atmosphere/contents/0100000000001007/
move /config/cowmmc/quarantined_themes/0100000000001013/ /atmosphere/contents/0100000000001013/
move /config/cowmmc/quarantined_themes/010000000000100B/ /atmosphere/contents/010000000000100B/
move /config/cowmmc/quarantined_themes/0100000000000811/ /atmosphere/contents/0100000000000811/

[Clean Error & Crash Reports]
delete /atmosphere/erpt_reports/
delete /atmosphere/fatal_reports/

[Dot Clean SD]
dot-clean '/atmosphere/'
dot-clean '/switch/'
dot-clean '/config/'

[@System Power]

[Reboot to Hekate / Nyx]
;hold=true
reboot hekate

[Reboot to cowMMC CFW]
;hold=true
reboot

[Power Off Console]
;hold=true
shutdown
